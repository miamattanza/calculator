<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindMatch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #6a5acd 0%, #48c6ef 100%);
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 48px 36px;
    max-width: 420px;
    width: 100%;
  }
  h1 { font-size: 2rem; margin-bottom: 12px; }
  p { opacity: 0.9; margin-bottom: 28px; line-height: 1.5; }
  .btn {
    display: inline-block;
    background: #fff;
    color: #6a5acd;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
</style>
</head>
<body>
  <div class="card">
    <h1>MindMatch</h1>
    <p>Тест на совместимость. Узнай, насколько вы совпадаете.</p>
    <a class="btn" href="https://t.me/AdminMindMatch?start=start">Открыть в Telegram</a>
  </div>
</body>
</html>
